[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rpa-control-center"
version = "0.1.0"
description = "Local work-queue API for resilient RPA orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Chakri-Kolan" }]
dependencies = [
  "anyio>=4,<4.12",
  "fastapi>=0.115,<0.116",
  "pydantic>=2.9,<3",
  "uvicorn>=0.32,<0.35",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.29",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
rpa-control-center = "rpa_control_center.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=rpa_control_center --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
